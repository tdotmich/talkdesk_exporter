# OpenTelemetry Collector config. The Prometheus receiver scrapes the exporter,
# and the OTLP exporter sends the metrics to your backend.
# The Prometheus receiver is in the "otelcol-contrib" distribution.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: talkdesk
          scrape_interval: 15s
          static_configs:
            - targets: ["localhost:10060"]

processors:
  batch: {}

exporters:
  otlphttp:
    endpoint: https://otlp.example.com
    # headers:
    #   Authorization: "Bearer ${env:OTLP_TOKEN}"

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [otlphttp]
